<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emerging Sciences – Free Lectures</title>
<meta name="description" content="Free lectures and study material for JEE, CBSE 12th, NDA and CUET students.">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07090f;--panel:#0d111c;--line:#1f2638;--ink:#f2f4fa;--mute:#8d97b3;--gold:#e9c54f}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:500 16px/1.5 Montserrat,system-ui,sans-serif;display:flex}
:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}

/* Left sidebar: 3 equal parts, full height */
nav{width:230px;flex:none;height:100vh;height:100dvh;display:flex;flex-direction:column;border-right:1px solid var(--line)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--panel);color:var(--mute);border:0;border-bottom:1px solid var(--line);font:700 1.05rem Montserrat,sans-serif;cursor:pointer}
nav button:last-child{border-bottom:0}
nav button svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button:hover{color:var(--ink)}
nav button[aria-current=page]{background:var(--bg);color:var(--gold);box-shadow:inset 4px 0 0 var(--gold)}

/* Right side */
.side{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:auto}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 32px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.2rem}
.brand img{width:40px;height:40px}
.social{display:flex;gap:10px}
.social a{width:42px;height:42px;display:grid;place-items:center;border:1px solid var(--line);border-radius:50%;color:var(--ink)}
.social a:hover{color:var(--bg);background:var(--gold);border-color:var(--gold)}
.social svg{width:20px;height:20px;fill:currentColor}
main{flex:1;padding:48px 32px}
section{display:none;max-width:760px}
section.on{display:block}
h1{font-weight:800;font-size:clamp(2rem,5vw,3.4rem);line-height:1.12;margin-bottom:18px}
h1 span{color:var(--gold)}
p{color:var(--mute);max-width:52ch}
.soon{color:var(--mute)}

/* Intro splash */
#intro{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:10;cursor:pointer;transition:opacity .6s}
#intro.out{opacity:0;pointer-events:none}
#intro img{width:120px;height:120px;animation:pop 1.2s ease-out both}
#intro b{font-weight:800;font-size:1.6rem;letter-spacing:.02em;animation:rise 1s .5s ease-out both}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#intro img,#intro b{animation:none}}

/* Phone: sidebar becomes bottom bar */
@media (max-width:720px){
  body{flex-direction:column-reverse}
  nav{width:100%;height:68px;flex-direction:row;border-right:0;border-top:1px solid var(--line)}
  nav button{flex-direction:row;gap:8px;font-size:.85rem;border-bottom:0;border-right:1px solid var(--line)}
  nav button:last-child{border-right:0}
  nav button svg{width:22px;height:22px}
  nav button[aria-current=page]{box-shadow:inset 0 3px 0 var(--gold)}
  .side{height:auto;flex:1}
  header{padding:12px 16px}.brand{font-size:1rem}.brand img{width:32px;height:32px}
  .social a{width:36px;height:36px}.social svg{width:17px;height:17px}
  main{padding:32px 18px}
}
</style>
</head>
<body>

<div id="intro" role="presentation">
  <img src="logo.png" alt="Emerging Sciences logo">
  <b>Emerging Sciences</b>
</div>

<nav aria-label="Main menu">
  <button data-p="home" aria-current="page">
    <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>Home
  </button>
  <button data-p="lectures">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/></svg>Lectures
  </button>
  <button data-p="material">
    <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5zM4 5.5V21M8 7h8"/></svg>Study Material
  </button>
</nav>

<div class="side">
  <header>
    <div class="brand"><img src="logo.png" alt=""><span>Emerging Sciences</span></div>
    <div class="social">
      <a href="https://youtube.com/@EMS4518-k4s" target="_blank" rel="noopener" aria-label="YouTube"><svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2C0 8.1 0 12 0 12s0 3.9.5 5.8a3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1c.5-1.9.5-5.8.5-5.8s0-3.9-.5-5.8zM9.6 15.6V8.4l6.2 3.6-6.2 3.6z"/></svg></a>
      <a href="https://x.com/emergingsc28041" target="_blank" rel="noopener" aria-label="X (Twitter)"><svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></a>
      <a href="https://t.me/emer816" target="_blank" rel="noopener" aria-label="Telegram"><svg viewBox="0 0 24 24"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.33 1.43.18 1.15 1.3l-2.72 12.81c-.19.91-.74 1.13-1.5.71L12.6 16.3l-1.99 1.93c-.23.23-.42.42-.83.42z"/></svg></a>
    </div>
  </header>

  <main>
    <section id="home" class="on">
      <h1>Free Lectures for <span>JEE, CBSE 12th, NDA &amp; CUET</span></h1>
      <p>Bilkul free. Koi fees nahi, koi registration nahi.</p>
    </section>
    <section id="lectures"><h1>Lectures</h1><p class="soon">Coming soon.</p></section>
    <section id="material"><h1>Study Material</h1><p class="soon">Coming soon.</p></section>
  </main>
</div>

<script>
const btns = document.querySelectorAll("nav button"), secs = document.querySelectorAll("section");
function show(p){
  if (!document.getElementById(p)) p = "home";
  secs.forEach(s => s.classList.toggle("on", s.id === p));
  btns.forEach(b => b.toggleAttribute("aria-current", b.dataset.p === p));
  btns.forEach(b => { if (b.dataset.p === p) b.setAttribute("aria-current","page"); });
}
btns.forEach(b => b.onclick = () => { location.hash = b.dataset.p; });
addEventListener("hashchange", () => show(location.hash.slice(1)));
show(location.hash.slice(1));

const intro = document.getElementById("intro");
const hide = () => { intro.classList.add("out"); setTimeout(() => intro.remove(), 700); };
intro.onclick = hide; setTimeout(hide, 2300);
</script>
</body>
</html>
